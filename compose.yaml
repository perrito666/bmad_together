services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bmad
      POSTGRES_PASSWORD: bmad
      POSTGRES_DB: bmad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmad"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Dev server with autoreload; the image's entrypoint migrates first.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://bmad:bmad@db:5432/bmad
      SECRET_KEY: dev-insecure-change-me
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      # Seed an admin so /admin/ is usable immediately (override in real use).
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
