name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmad
          POSTGRES_PASSWORD: bmad
          POSTGRES_DB: bmad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://bmad:bmad@localhost:5432/bmad
      SECRET_KEY: ci-insecure
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Migrations check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest
